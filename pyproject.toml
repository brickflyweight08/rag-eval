[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rag-eval"
version = "0.1.0"
description = "A small, general-purpose toolkit for evaluating retrieval-augmented generation (RAG) systems."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["pydantic>=2", "typer", "openai", "numpy", "matplotlib"]

[project.optional-dependencies]
demo = ["rank-bm25", "sentence-transformers"]
dev = ["pytest", "ruff"]

[project.scripts]
rag-eval = "rag_eval.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_eval"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "."]
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
markers = [
    "llm: makes real calls to the judge LLM (needs RAG_EVAL_JUDGE_API_KEY)",
]
