name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # rank-bm25 is light; the dense demo (sentence-transformers) is not needed for tests.
      - run: pip install -e ".[dev]" rank-bm25
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -m "not llm"
